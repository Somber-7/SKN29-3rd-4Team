services:
  pipelines:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipelines
    container_name: naming-pipelines
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
      - ./src:/app/src_naming
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

volumes:
  hf-cache:
